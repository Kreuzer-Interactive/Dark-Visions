[sdl]
autolock=false

[cpu]
cycles=max

[autoexec]
mount Q C:\Code\TOOLS\qb45
mount D C:\Code\Dark-Visions\src
Q:
del D:GAME.OBJ
del D:GAME2.OBJ
del D:GAME3.OBJ
del D:GAME4.OBJ
del D:GAME5.OBJ
del D:GAME.EXE
echo === BC GAME === > D:BUILD.LOG
BC D:GAME.BAS, D:GAME.OBJ, D:GAME.LST /O /W /E; >> D:BUILD.LOG
echo === BC GAME2 === >> D:BUILD.LOG
BC D:GAME2.BAS, D:GAME2.OBJ, D:GAME2.LST /O /W /E; >> D:BUILD.LOG
echo === BC GAME3 === >> D:BUILD.LOG
BC D:GAME3.BAS, D:GAME3.OBJ, D:GAME3.LST /O /W /E; >> D:BUILD.LOG
echo === BC GAME4 === >> D:BUILD.LOG
BC D:GAME4.BAS, D:GAME4.OBJ, D:GAME4.LST /O /W /E; >> D:BUILD.LOG
echo === BC GAME5 === >> D:BUILD.LOG
BC D:GAME5.BAS, D:GAME5.OBJ, D:GAME5.LST /O /W /E; >> D:BUILD.LOG
echo === LINK === >> D:BUILD.LOG
LINK D:GAME.OBJ+D:GAME2.OBJ+D:GAME3.OBJ+D:GAME4.OBJ+D:GAME5.OBJ, D:GAME.EXE, D:GAME.MAP, QB.LIB; >> D:BUILD.LOG
echo === DONE === >> D:BUILD.LOG
exit
