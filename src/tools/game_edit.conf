[sdl]
autolock=false

[cpu]
cycles=max
cputype=486

[autoexec]
mount D C:\Code\Dark-Visions\src
D:
cd \
rem the intro car's turn editor (GAME7 IntroCar3D, C3DEDIT): Left/Right arrows turn
rem the car as it drives, the last frame holds at the end, R repeats and re-records,
rem Esc, S or space goes on; the turn is saved as C3DTURN.DAT and applied to normal runs
set C3DEDIT=1
GAME.EXE
exit
