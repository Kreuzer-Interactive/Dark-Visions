; Dark Visions settings
; Lines starting with ; are comments.
; showfps=1 shows main loop speed top right + intro pace
showfps=0
; joystick=1 enables joystick/gamepad control (off avoids stray input)
joystick=0
; mouse=0 enables mouse cursor + hardware pointer (needs a mouse driver)
mouse=1
; mousecursor: 0 driver default, 1 arrow, 2 crosshair, 3 box, 4 crosshair(xor), 5 NE arrow
mousecursor=0
; mousesnap: click pulls to nearest hotspot within N pixels (0=off/exact)
mousesnap=6
; exitcursor=1 changes the pointer to a direction arrow near room exits
exitcursor=1
; mousexy=0 shows live mouse x,y + snapped hit point bottom row (debug)
mousexy=0
; lookmiss=1 shows a random 'nothing to see' line after looking 3x at an empty
; spot, and a random 'that doesn't work' line when a use action does nothing
lookmiss=1
; killers=1 turns off the roaming killers (for testing; scripted deaths still happen)
killers=1
; quickstart=0 jumps straight into the game - no intro, title or instructions prompt (testing)
quickstart=0
; revive=1 auto-saves when a timed-death room arms and, after dying there,
; restores that save with a message instead of the Load screen
revive=1
; hit-zone debug overlay (needs mouse=1): ring hotspot click-zones, 1=show 0=hide (look=blue action=brown get/use=gray)
hitzone_look=0
hitzone_get=0
hitzone_use=0
hitzone_action=0
