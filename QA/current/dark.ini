; Dark Visions settings
; showfps=1 shows main loop speed top right + intro pace
showfps=0
; joystick=1 enables joystick/gamepad control (off avoids stray input)
joystick=0
; mouse=1 enables mouse cursor + hardware pointer (needs a mouse driver)
mouse=1
; mousecursor: 0 driver default, 1 arrow, 2 crosshair, 3 box, 4 crosshair(xor)
mousecursor=1
; mousesnap: click pulls to nearest hotspot within N pixels (0=off/exact)
mousesnap=6
; exitcursor=1 changes the pointer to a direction arrow near room exits
exitcursor=1
; mousexy=1 shows live mouse x,y + snapped hit point bottom row (debug; needs mouse=1)
mousexy=1
; lookmiss=1 shows a random 'nothing to see' line after looking 3x at an empty spot
lookmiss=1
; intro=1 plays the opening cutscene (set 0 to skip it)
intro=1
; hit-zone debug overlay (needs mouse=1): ring hotspot click-zones, 1=show 0=hide (look=blue action=brown get/use=gray)
hitzone_look=1
hitzone_get=0
hitzone_use=0
hitzone_action=0
